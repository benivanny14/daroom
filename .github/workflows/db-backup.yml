name: Database backup

# Run manually from the Actions tab. Add `SUPABASE_DB_URL` as a repository
# secret first: Supabase dashboard -> Project Settings -> Database -> Connection
# string (URI, session pooler, port 5432). The dump is uploaded as an artifact
# and kept for 90 days; download it and store it somewhere durable. GitHub can
# disable scheduled workflows after 60 days without repository activity, so
# treat this as a safety net, not the only backup.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the database URL
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL is not set; skipping the backup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump the database
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom \
            --file="backup/darroom-$(date -u +%Y%m%dT%H%M%SZ).dump"
          ls -lh backup

      - name: Upload the dump
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: darroom-db-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 90
          if-no-files-found: error
